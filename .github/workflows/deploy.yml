# Build and publish the Jupyter Book, then create or update the daily release.

name: Jupyter Book (via myst) GitHub Pages Deploy

on:
  push:
    branches: [main]

env:
  # The book is published at:
  # https://MichaelBarmann.github.io/git-github-powershell/
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install Jupyter Book
        run: npm install -g jupyter-book

      - name: Build HTML
        run: jupyter-book build --html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create or update daily release
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: America/New_York
        shell: bash
        run: |
          month_number=$(date +%-m)

          case "$month_number" in
            1) month_name="Jan" ;;
            2) month_name="Feb" ;;
            3) month_name="Mar" ;;
            4) month_name="Apr" ;;
            5) month_name="May" ;;
            6) month_name="June" ;;
            7) month_name="July" ;;
            8) month_name="Aug" ;;
            9) month_name="Sept" ;;
            10) month_name="Oct" ;;
            11) month_name="Nov" ;;
            12) month_name="Dec" ;;
          esac

          release_date="$month_name $(date +%-d), $(date +%Y)"
          release_title="Daily Build - $release_date"
          release_tag="daily-build-$(date +%Y-%m-%d)"
          release_notes="[Open the published Jupyter Book](https://MichaelBarmann.github.io/git-github-powershell/)"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          else
            gh release create "$release_tag" \
              --target "${{ github.sha }}" \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest
          fi